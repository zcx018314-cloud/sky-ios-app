name: SkyApp
options:
  bundleIdPrefix: com.sky
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
targets:
  SkyApp:
    type: application
    platform: iOS
    sources:
      - SkyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sky.tool
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        INFOPLIST_FILE: SkyApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
